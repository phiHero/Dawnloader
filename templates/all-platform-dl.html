<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="{{ url_for('static', filename = './assets/js/download.js') }}"
    ></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'IBM Plex Sans', sans-serif;
      }
      body {
        background-color: #0a2342;
      }
      .webname3 {
        font-size: 22px;
        margin-bottom: 20px;
        font-weight: 600;
      }
      .wrapper {
        text-align: center;
        margin-top: 150px;
      }
      .wrapper .container {
        margin: auto;
        width: min(600px, 90vw);
        border: 5px outset #ff4d5a;
        position: relative;
        padding-right: 10px;
        border-radius: 5px;
        background-color: white;
        display: flex;
        flex-direction: column;
        padding-bottom: 1rem;
      }
      .wrapper .container #back {
        position: absolute;
        top: 0;
        left: 0;
        background-color: #ff4d5a;
        color: white;
        font-size: 16px;
        padding: 5px 10px;
        border: none;
        border-radius: 0 0 5px 0;
        cursor: pointer;
      }

      .wrapper .container .video_info {
        flex: 0.35;
      }
      .wrapper .container .video_info img {
        width: 100%;
        object-fit: contain;
      }
      .wrapper .container .video_info h3 {
        text-align: left;
        margin-left: 10px;
        margin-top: 10px;
      }
      .form {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .wrapper .container .bs {
        flex: 0.65;
        width: 350px;
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        text-align: left;
        align-items: center;
        gap: 1rem;
      }
      .wrapper .container .bs select {
        width: 300px;
        padding: 5px 0 5px 7px;
        font-size: 15px;
        border-radius: 2px;
      }
      .wrapper .container .bs button {
        margin-top: 10px;
        background-color: #ff4d5a;
        font-size: 15px;
        color: white;
        border: 1px groove gray;
        padding: 5px 12px;
        border-radius: 5px;
        cursor: pointer;
      }
      @media screen and (max-width: 800px) {
        .wrapper {
          margin-top: 80px;
        }
        .wrapper .container .video_info img {
          width: 175px;
        }
        .wrapper .container .bs {
          position: unset;
          margin-top: 20px;
        }
        header {
          margin-top: 10px;
        }
        header a {
          margin-left: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <form action="/indexing" method="get">
          <button id="back">Back</button>
        </form>
        <p class="webname3">
          <span style="color: #ff4d5a; font-size: 25px">YT</span> Downloader
        </p>
        <div class="form" id="all-platforms">
          <div class="video_info">
            <img src="{{info.thumbnail}}" alt="" />
          </div>

          <div class="bs">
            <h3>{{info.title}}</h3>
            <select
              name="itag"
              class="form-select input-sm"
              aria-label="Default select example"
            >
              {% for format in info.formats %} {}
              <option
                value="{{ format.url }}"
                data-label="{{ format.format }} | {{format.format_note}} | {{format.tbr}}kbps"
                data-ext="{{format.ext}}"
              >
                {{ format.format }} &nbsp;&nbsp;|&nbsp;&nbsp;
                {{format.format_note}} &nbsp;&nbsp;|&nbsp;&nbsp;
                {{format.tbr}}kbps
              </option>
              {% endfor %}
              <!--  -->
            </select>
            <div>
              <button type="submit" name="action">Download</button>
            </div>
            <span id="error-message"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
